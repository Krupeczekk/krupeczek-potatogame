<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Potato Clicker</title>
</head>
<body>
    <div class="view">
        <div class="container">
            <div class="score">10</div>
            <div class="potato-wrapper">
                <img src="images/potato_image.png" id="potato">
            </div>
            <div class="instruction">Klikaj w ziemniaka, bij rekordy!!!</div>
            <div class="statistics">
                <div class="stat-wrapper record">
                    <div class="label">Rekord</div>
                    <div class="value" id="record-amount">10</div>
                </div>
                <div class="stat-wrapper last">
                    <div class="label">Rekord ostatniej gry</div>
                    <div class="value" id="last-amount">10</div>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="script.js"></script>
</html>
